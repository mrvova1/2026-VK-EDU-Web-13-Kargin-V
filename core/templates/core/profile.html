{% extends "base.html" %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}

{% block extra_css %}
<link href="{% static 'core/css/profile.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container py-4">
  <p class="Headline">Profile</p>

  <form class="profile-form" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <h1 class="base-text profile-form-item">Login</h1>
    <input type="text" class="profile-form-item base-text" placeholder="Your login">

    <h1 class="base-text profile-form-item">Email</h1>
    <input type="email" class="profile-form-item base-text" placeholder="name@example.com">

    <h1 class="base-text profile-form-item">NickName</h1>
    <input type="text" class="profile-form-item base-text" placeholder="Your nickname">

    <h1 class="base-text profile-form-item">Upload avatar</h1>
    <div class="avatar">
      <img src="{% static 'img/breakdance.gif' %}" alt="mdo" class="avatar-img">
      <div class="choice">
        <input type="file" class="base-text">
      </div>
    </div>

    <div></div>
    <button class="btn btn-outline-success" type="submit">Save</button>
  </form>
</div>
{% endblock %}
