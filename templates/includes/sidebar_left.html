<aside class="l-sidebar d-none d-md-block">
  <nav id="l-sidebar" class="nav flex-column nav-vertical">
    <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">
      <i class="bi bi-house-door"></i><span>Главная</span>
    </a>

    {% if user.is_authenticated %}
      <a class="nav-link {% if request.resolver_match.url_name == 'ask' %}active{% endif %}" href="{% url 'ask' %}">
        <i class="bi bi-pencil-square"></i><span>Задать вопрос</span>
      </a>
      <a class="nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}" href="{% url 'profile' %}">
        <i class="bi bi-person-circle"></i><span>Профиль</span>
      </a>
    {% else %}
      <span class="nav-link disabled" title="Войдите, чтобы задать вопрос">
        <i class="bi bi-pencil-square"></i><span>Задать вопрос</span>
      </span>
      <span class="nav-link disabled" title="Войдите, чтобы открыть профиль">
        <i class="bi bi-person-circle"></i><span>Профиль</span>
      </span>
    {% endif %}

    <a class="nav-link {% if request.resolver_match.url_name == 'hot' %}active{% endif %}" href="{% url 'hot' %}">
      <i class="bi bi-fire"></i><span>Популярные</span>
    </a>
  </nav>
</aside>
