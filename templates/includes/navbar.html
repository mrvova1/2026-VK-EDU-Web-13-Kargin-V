{% load static %}
<header class="site-header">
  <nav class="navbar navbar-expand-lg nav_bar_color">
    <div class="container-fluid gap-3">
      <a class="navbar-brand text-white fw-semibold" href="{% url 'home' %}">EDU-Web</a>

      <form class="d-flex search_bar" role="search" action="{% url 'search' %}" method="get">
        <input
          class="form-control form-control-my"
          type="search"
          name="q"
          value="{{ request.GET.q }}"
          placeholder="Поиск по вопросам, тексту и тегам"
          aria-label="Search"
        >
        <button class="btn btn-outline-success ms-2" type="submit">Search</button>
      </form>

      {% if user.is_authenticated %}
        <a href="{% url 'ask' %}" class="btn btn-success text-nowrap">Создать вопрос</a>
      {% else %}
        <span class="btn btn-success text-nowrap disabled" title="Войдите, чтобы задать вопрос">Создать вопрос</span>
      {% endif %}

      <div class="user-block ms-2">
        {% if user.is_authenticated %}
  <div class="auth-block d-flex align-items-center gap-2">
    <a href="{% url 'profile' %}" class="d-flex align-items-center gap-2 text-decoration-none text-white">
      {% if user.profile.avatar %}
        <img src="{{ user.profile.avatar.url }}" alt="User avatar" width="32" height="32" class="rounded-circle">
      {% else %}
        <img src="{% static 'img/breakdance.gif' %}" alt="User avatar" width="32" height="32" class="rounded-circle">
      {% endif %}
      <span class="d-none d-md-inline">{{ user.username }}</span>
    </a>

    <form action="{% url 'logout' %}" method="post" class="d-inline">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button type="submit" class="btn btn-link text-white text-decoration-none p-0" title="Выйти">
        Выход
      </button>
    </form>
  </div>
{% else %}
          <div class="unauth-block">
            <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Login</a>
            <a href="{% url 'signup' %}" class="btn btn-light btn-sm">Signup</a>
          </div>
        {% endif %}
      </div>
    </div>
  </nav>
</header>
