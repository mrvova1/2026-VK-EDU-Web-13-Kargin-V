<!doctype html>
<html lang="en">
  
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Логин</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="static/css/base_items.css" rel="stylesheet">
  <link href="static/css/forms.css" rel="stylesheet">
</head>

<body class="background">
  <main class="container py-5 auth-page">
    <section class="auth-card">
      <p class="Headline mb-4">Login</p>

      <form class="auth-form">
        <div class="form-group">
          <label for="login-username" class="base-text">Username or email</label>
          <input id="login-username" type="text" placeholder="name@example.com" autocomplete="username" required>
          <div class="form-error d-none">Enter your login or email.</div>
        </div>

        <div class="form-group">
          <label for="login-password" class="base-text">Password</label>
          <input id="login-password" type="password" placeholder="Your password" autocomplete="current-password"
            required>
          <div class="form-error d-none">Password is required.</div>
        </div>

        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
          <label class="remember-me">
            <input type="checkbox">
            <span>Remember me</span>
          </label>

          <a href="#" class="auth-link">Forgot password?</a>
        </div>

        <button class="btn btn-success btn-lg w-100" type="submit">Sign in</button>

        <p class="auth-bottom mb-0 base-text-hints">
          No account yet?
          <a href="signup.html">Create one</a>
        </p>
      </form>
    </section>
  </main>
</body>

</html>
