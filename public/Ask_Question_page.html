<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask a question</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="static/css/base_items.css" rel="stylesheet">
  <link href="static/css/forms.css" rel="stylesheet">
  <link href="static/css/Ask_Question_page.css" rel="stylesheet">
</head>

<body class="background">
  <p class="Headline">New questions</p>
  <form class="question-form">
    <h1 class="base-text question-form-item">Title</h1>
    <div class="question-form-item">
      <input type="text" placeholder="How can I properly link my navigation bar?" class="base-text">
      <div class="form-error d-none base-text">Title is required.</div>
    </div>
    <h1 class="base-text question-form-item">Text</h1>
    <div class="question-form-item">
      <textarea placeholder="Who knows" class="base-text"></textarea>
      <div class="form-error d-none base-text">Question text is required.</div>
    </div>

    <h1 class="base-text question-form-item">Tags</h1>
    <input type="text" placeholder="#misteryOfAllTimes #webdevelopment" class="question-form-item base-text">

    <div></div>
    <button class="masked-button question-form-item"></button>
  </form>
</body>

</html>
