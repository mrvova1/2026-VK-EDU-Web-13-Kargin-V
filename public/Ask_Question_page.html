<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="static/css/base_items.css" rel="stylesheet">
  <link href="static/css/Ask_Question_page.css" rel="stylesheet">
</head>

<body>
  <p class="Headline">New questions</p>
  <div class="question-form">

    <h1 class="base-text question-form-item">Text</h1>

    <h1 class="base-text question-form-item">Tags</h1>

    <div></div>
