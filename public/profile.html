<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Профиль</title>
  <link href="static/css/base_items.css" rel="stylesheet">
  <link href="static/css/profile.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body class="background">
  <p class="Headline">Profile</p>
  <div class="profile-form">
    <h1 class="base-text profile-form-item">Login</h1>
    <input type="text" placeholder="How can I properly link my navigation bar?" class="profile-form-item base-text">

    <h1 class="base-text profile-form-item">Email</h1>
    <input type="text" placeholder="Who knows" class="profile-form-item base-text">

    <h1 class="base-text profile-form-item">NickName</h1>
    <input type="text" placeholder="#misteryOfAllTimes #webdevelopment" class="profile-form-item base-text">

    <h1 class="base-text profile-form-item">Upload avatar</h1>
    <div class="avatar">
      <img src="static/img/breakdance.gif" alt="mdo" class="avatar-img">
      <div class="choice">
        <input type="text" placeholder="C://" class="base-text">
        <div class="btn btn-outline-success">Choose</div>
      </div>
    </div>
    <div></div>
    <button class="btn btn-outline-success" type="submit">Save</button>
</body>

</html>
