<!doctype html>
<html lang="en">
  
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="static/css/base_items.css" rel="stylesheet">
  <link href="static/css/forms.css" rel="stylesheet">
</head>

<body class="background">
  <main class="container py-5 auth-page">
    <section class="auth-card">
      <p class="Headline mb-4">Sign up</p>

      <form class="auth-form">
        <div class="form-group">
          <label for="signup-username" class="base-text">Username</label>
          <input id="signup-username" type="text" placeholder="Your nickname" autocomplete="username" required>
          <div class="form-error d-none">Username is required.</div>
        </div>

        <div class="form-group">
          <label for="signup-email" class="base-text">Email</label>
          <input id="signup-email" type="email" placeholder="name@example.com" autocomplete="email" required>
          <div class="form-error d-none">Enter a valid email.</div>
        </div>

        <div class="form-group">
          <label for="signup-password" class="base-text">Password</label>
          <input id="signup-password" type="password" placeholder="Create a password" autocomplete="new-password"
            required>
          <div class="form-hint base-text-hints">At least 8 characters is a good start.</div>
        </div>

        <div class="form-group">
          <label for="signup-repeat" class="base-text">Repeat password</label>
          <input id="signup-repeat" type="password" placeholder="Repeat password" autocomplete="new-password" required>
          <div class="form-error d-none">Passwords must match.</div>
        </div>

        <button class="btn btn-success btn-lg w-100" type="submit">Create account</button>

        <p class="auth-bottom mb-0 base-text-hints">
          Already have an account?
          <a href="login.html">Sign in</a>
        </p>
      </form>
    </section>
  </main>
</body>

</html>
