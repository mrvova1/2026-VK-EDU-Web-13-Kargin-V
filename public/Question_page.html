<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="static/css/base_items.css" rel="stylesheet">
  <link href="static/css/Question_page.css" rel="stylesheet">

</head>

<body>
  <div class="question">
    <div class="left-bar">
      <img src="static/img/breakdance.gif" alt="mdo">
      <div class="votes">
        <h4 class="base-text">0</h4>
        <div class="Up-Down">
          <button class="upvote">∧</button>
          <button class="downvote">∨</button>
        </div>
      </div>
    </div>
    <div class="right-bar">
      <div class="upper-bar">
        <a href="/question/1" class="Headline">Question 1</a>
        <h4 class="base-text">######### #### ########## ######### ##### #### ## ##########</h4>
      </div>
      <div class="down-bar">
        <div class="tegs">
          <h4 class="base-text">Tags:</h4>
          <a href="">#tag2</a>
          <a href="">#tag3</a>
          <a href="">#tag2</a>
          <a href="">#tag3</a>
          <a href="">#tag2</a>
          <a href="">#tag3</a>
        </div>
      </div>
    </div>
  </div>
  <hr>
  <div class="answers_box">
    <div class="answer">
      <div class="left-bar">
        <img src="static/img/breakdance.gif" alt="mdo">
        <div class="votes">
          <h4 class="base-text">0</h4>
          <div class="Up-Down">
            <button class="upvote">∧</button>
            <button class="downvote">∨</button>
          </div>
        </div>
      </div>
      <div class="right-bar">
        <div class="upper-bar">
          <h4 class="base-text">######### #### ########## ######### ##### #### ## ##########</h4>
        </div>
        <label class="big-checkbox">
          <input type="checkbox">
          <span class="checkmark"></span>
          Correct!
        </label>
      </div>
    </div>
  </div>
</body>

</html>
