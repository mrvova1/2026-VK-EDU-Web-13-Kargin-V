<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница вопроса</title>
  <link href="static/css/base_items.css" rel="stylesheet">
  <link href="static/css/Question_page.css" rel="stylesheet">
  <link href="static/css/pages_num_menu.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body class="background">
  <div class="question">
    <div class="left-bar">
      <img src="static/img/breakdance.gif" alt="mdo">
      <div class="votes">
        <h4 class="base-text">0</h4>
        <div class="Up-Down">
          <button class="upvote">∧</button>
          <button class="downvote">∨</button>
        </div>
      </div>
    </div>
    <div class="right-bar">
      <div class="upper-bar">
        <a href="/question/1" class="Headline">Question 1</a>
        <h4 class="base-text">######### #### ########## ######### ##### #### ## ##########</h4>
      </div>
      <div class="down-bar">
        <div class="tegs">
          <h4 class="base-text">Tags:</h4>
          <a href="">#tag2</a>
          <a href="">#tag3</a>
          <a href="">#tag2</a>
          <a href="">#tag3</a>
          <a href="">#tag2</a>
          <a href="">#tag3</a>
        </div>
      </div>
    </div>
  </div>
  <hr>
  <div class="answers_box">
    <div class="answer">
      <div class="left-bar">
        <img src="static/img/breakdance.gif" alt="mdo">
        <div class="votes">
          <h4 class="base-text">0</h4>
          <div class="Up-Down">
            <button class="upvote">∧</button>
            <button class="downvote">∨</button>
          </div>
        </div>
      </div>
      <div class="right-bar">
        <div class="upper-bar">
          <h4 class="base-text">######### #### ########## ######### ##### #### ## ##########</h4>
        </div>
        <label class="big-checkbox base-text">
          <input type="checkbox">
          <span class="checkmark"></span>
          Correct!
        </label>
      </div>
    </div>
  </div>
  <nav class="nums" aria-label="Pagination">
    <a href="#" class="nums-prev disabled" aria-disabled="true">Prev</a>
    <a href="#" class="active" aria-current="page">1</a>
    <a href="#">2</a>
    <a href="#">3</a>
    <span class="nums-dots">...</span>
    <a href="#">5</a>
    <a href="#" class="nums-next">Next</a>
  </nav>
  <form class="answer-form mt-4">
    <div class="my-answer">
      <label class="base-text">Your answer</label>
      <textarea id="answer-text" placeholder="Write your answer here"></textarea>
    </div>

    <div class="form-hint base-text-hints">Be clear and include code if needed.</div>
    <button class="btn btn-success mt-3" type="submit">Post answer</button>
  </form>
</body>

</html>
